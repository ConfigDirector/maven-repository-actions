name: Upload to the ConfigDirector Maven repository
description: Uploads released versions from a staging Maven repository to the repository bucket, attesting every AAR, jar and POM first. For each version it uploads the version's files, then its POM, then rewrites the artifact's maven-metadata.xml. A version whose POM is already in the bucket is refused before anything is uploaded.

inputs:
  staging-directory:
    description: Directory holding the Maven repository layout the build published into.
    required: false
    default: build/maven-repository
  bucket:
    description: Name of the R2 bucket behind the repository.
    required: true
  endpoint:
    description: S3 endpoint of the bucket, https://<account id>.r2.cloudflarestorage.com.
    required: true
  access-key-id:
    description: Access key ID of an R2 API token with Object Read & Write on the bucket.
    required: true
  secret-access-key:
    description: Secret access key of that token.
    required: true
  artifacts:
    description: The versions to upload, one group:artifactId:version per line.
    required: true
  attest:
    description: Whether to create GitHub build attestations for the AARs, jars and POMs. The job then needs the id-token and attestations write permissions.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Refuse a version that is already in the Maven repository
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: '"$GITHUB_ACTION_PATH/../scripts/maven-repository.sh" check "$BUCKET" "$ENDPOINT" "$ARTIFACTS"'

    - name: Attest the AARs, jars and POMs
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          ${{ inputs.staging-directory }}/**/*.aar
          ${{ inputs.staging-directory }}/**/*.jar
          ${{ inputs.staging-directory }}/**/*.pom

    - name: Upload to the Maven repository
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        STAGING_DIRECTORY: ${{ inputs.staging-directory }}
        BUCKET: ${{ inputs.bucket }}
        ENDPOINT: ${{ inputs.endpoint }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: '"$GITHUB_ACTION_PATH/../scripts/maven-repository.sh" upload "$STAGING_DIRECTORY" "$BUCKET" "$ENDPOINT" "$ARTIFACTS"'
